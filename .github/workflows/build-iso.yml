name: Build ISO

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "1.*"

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean
          df -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools xorriso rsync curl ca-certificates gdisk

      - name: Build ISO
        env:
          VERSION: 1.0.0-beta.1
        run: |
          chmod +x iso/build.sh
          ./iso/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mariiy_nvr_os-1.0.0-beta.1-amd64
          path: |
            dist/*.iso
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=1.0.0-beta.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.iso dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.iso dist/*.sha256 \
              --title "$TAG" \
              --notes-file docs/RELEASE_NOTES_1.0.0-beta.1.md
          fi
