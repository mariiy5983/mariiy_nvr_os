name: Build ISO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean
          df -h

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso rsync curl ca-certificates python3

      - name: Build Installer ISO
        env:
          VERSION: "1.0.0"
        run: |
          chmod +x iso/build-installer.sh
          ./iso/build-installer.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mariiy_nvr_os-1.0.0-amd64-installer
          path: |
            dist/*.iso
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
