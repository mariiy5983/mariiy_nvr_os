<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mariiy NVR 遠端設定</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #07111b;
      color: #e7f2fb;
      font: 16px/1.5 "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif;
    }
    main { max-width: 420px; margin: 0 auto; padding: 28px 20px 40px; }
    .brand { margin: 0; color: #8eabc2; font-size: 13px; letter-spacing: 0.04em; }
    h1 { margin: 6px 0 12px; font-size: 28px; font-weight: 650; }
    .lead, .hint { margin: 0 0 18px; color: #8eabc2; font-size: 14px; }
    button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 6px;
      background: #0e5fae;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    label { display: block; margin-bottom: 8px; color: #b7cde0; font-size: 14px; }
    input {
      width: 100%;
      height: 46px;
      margin-top: 6px;
      padding: 0 12px;
      border: 1px solid #2c6ea3;
      border-radius: 6px;
      background: #0c1c2c;
      color: #fff;
      font: inherit;
    }
    .error { min-height: 22px; margin: 0 0 8px; color: #ffb4b4; font-size: 13px; }
    .ok { margin: 0 0 8px; font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Mariiy NVR</p>
    <h1>設定遠端</h1>
    <p class="lead">用這個網頁把主機接到 Cloudflare。路由器不用開連接埠。</p>
    <div id="auth">
      <button type="button" id="authBtn">前往 Cloudflare 授權</button>
      <p class="hint">授權後回到這裡填網域。不用複製連線碼。</p>
    </div>
    <form id="form" hidden>
      <label>網域名稱
        <input id="host" placeholder="nvr.你的網域" autocomplete="off" enterkeyhint="done">
      </label>
      <p class="error" id="error"></p>
      <button type="submit">送回主機</button>
    </form>
    <div id="done" hidden>
      <p class="ok" id="doneText"></p>
      <p class="hint">可以關閉這個頁面，回到主機看遠端狀態。</p>
    </div>
  </main>
  <script src="api.js"></script>
  <script>
    const KEY = "nvr-setup";
    function cleanHost(value) {
      return String(value || "").trim().replace(/^https?:\/\//i, "").replace(/\/.*$/, "").slice(0, 64);
    }
    function readStore() {
      try {
        return JSON.parse(localStorage.getItem(KEY) || "null") || {};
      } catch (err) {
        return {};
      }
    }
    function showDone(host) {
      document.getElementById("auth").hidden = true;
      document.getElementById("form").hidden = true;
      document.getElementById("done").hidden = false;
      document.getElementById("doneText").textContent = "已送回主機。外面以後開啟 https://" + host + " ，用管理員帳號登入。";
    }
    const saved = readStore();
    if (saved.remote && saved.remote.linked && saved.remote.host) showDone(saved.remote.host);
    document.getElementById("authBtn").addEventListener("click", () => {
      document.getElementById("auth").hidden = true;
      document.getElementById("form").hidden = false;
      document.getElementById("host").focus();
    });
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const host = cleanHost(document.getElementById("host").value);
      const error = document.getElementById("error");
      if (!host || !host.includes(".") || host === "nvr.example.com" || host.endsWith(".example.com")) {
        error.textContent = "請填你已經放在 Cloudflare 的網域。";
        return;
      }
      error.textContent = "";
      const data = readStore();
      const remoteObj = Object.assign(
        { enabled: true, host: "", linked: false, viewers: 2 },
        data.remote,
        { host: host, linked: true }
      );
      delete remoteObj.token;
      data.remote = remoteObj;
      localStorage.setItem(KEY, JSON.stringify(data));
      if (typeof MariiyAPI !== "undefined" && MariiyAPI.setRemote) {
        try { await MariiyAPI.setRemote(remoteObj); } catch (_) {}
      }
      showDone(host);
    });
  </script>
</body>
</html>
